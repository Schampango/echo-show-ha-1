plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hapanel'
    compileSdk 34

    defaultConfig {
        applicationId "com.hapanel"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Gepflegter JSch-Fork (drop-in, Paket com.jcraft.jsch) fuer SSH
    implementation 'com.github.mwiede:jsch:0.2.21'
}
